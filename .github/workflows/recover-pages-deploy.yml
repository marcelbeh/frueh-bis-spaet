name: Recover GitHub Pages deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-pages-deploy.yml

permissions:
  contents: read
  deployments: write
  id-token: write
  pages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.guard.outputs.should_deploy }}
    steps:
      - name: Confirm this is still the latest main
        id: guard
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: main } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "main"
            });

            if (main.commit.sha !== context.sha) {
              core.info("A newer main commit exists; this recovery run will not publish the older revision.");
              core.setOutput("should_deploy", "false");
              return;
            }

            core.setOutput("should_deploy", "true");

      - name: Check out the current main
        if: steps.guard.outputs.should_deploy == 'true'
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        if: steps.guard.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Release stale Pages deployments
        if: steps.guard.outputs.should_deploy == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: "github-pages", per_page: 100 }
            );

            let released = 0;
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 1
              });

              if (statuses[0]?.state !== "in_progress") continue;

              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Released stale GitHub Pages deployment before recovery"
              });
              core.info(`Marked stale deployment ${deployment.id} (${deployment.sha}) inactive.`);
              released += 1;
            }

            if (released === 0) {
              core.info("No in-progress GitHub Pages deployment was found.");
            }

  deploy:
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the current main
        id: deployment
        uses: actions/deploy-pages@v5
